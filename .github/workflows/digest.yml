name: Weekly trending digest

on:
  schedule:
    - cron: "30 15 * * 1" # Mondays 15:30 UTC ≈ 8:30am PT
  workflow_dispatch:
    inputs:
      analysis:
        description: "Add Claude research briefs"
        type: boolean
        default: true

# Two jobs so that the research step (Claude reading untrusted READMEs and web
# pages) never holds a token that can write issues: `build` is read-only and
# hands digest.md over as an artifact; `file` has issues: write and posts it.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # prior digest issues are the history source
    steps:
      - uses: actions/checkout@v4

      - name: Build digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIGEST_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python3 scripts/build_digest.py
          # keep a copy the research step cannot touch; the fold step renders from it
          cp digest.json digest.md "$RUNNER_TEMP"/

      - name: Decide whether to research
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          SWITCH: ${{ vars.DIGEST_ANALYSIS }}
          INPUT: ${{ inputs.analysis }}
        run: |
          enabled=true
          reason="research enabled: OAuth token present, DIGEST_ANALYSIS is not 'off', analysis input is not false"
          if [ "$HAS_TOKEN" != "true" ]; then
            enabled=false
            reason="research skipped: repo secret CLAUDE_CODE_OAUTH_TOKEN is not set"
          elif [ "$SWITCH" = "off" ]; then
            enabled=false
            reason="research skipped: repo variable DIGEST_ANALYSIS is 'off'"
          elif [ "$INPUT" = "false" ]; then
            enabled=false
            reason="research skipped: manual run with the 'Add Claude research briefs' checkbox off"
          fi
          echo "$reason"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Research
        id: research
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }} # read-only in this job; lets `gh api` GETs avoid rate limits
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            Read digest.json and follow the instructions in scripts/brief_prompt.md exactly.
            Write briefs.json in the repository root and nothing else.
          # The only writable path is briefs.json: Edit(...) rules govern every
          # built-in file-editing tool, Write included (code.claude.com/docs/en/permissions).
          # `gh api` is the only shell command: the prompt uses no other.
          claude_args: >-
            --allowedTools "Read,Edit(briefs.json),WebFetch,WebSearch,Bash(gh api:*)"
            --max-turns 300

      - name: Fold briefs in
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true # a failed fold still files the build's digest.md
        env:
          DIGEST_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # render only from the build's own inputs: tracked files as checked out,
          # digest.json as built, whatever the research step did to the workspace
          git checkout -- .
          cp "$RUNNER_TEMP"/digest.json "$RUNNER_TEMP"/digest.md .
          python3 scripts/build_digest.py render --briefs briefs.json

      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: |
            digest.md
            digest.json
            briefs.json
          retention-days: 7

  file:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digest

      - name: File digest as issue (GitHub emails the notification)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Trending digest — $(date -u '+%Y-%m-%d')"
          gh issue create --title "$title" --body-file digest.md --repo "$GITHUB_REPOSITORY"
          # keep the repo tidy: close digests older than the newest 8
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Trending digest" \
            --json number --jq '.[8:][].number' | while read -r n; do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
          done

  # Records the week in data/weeks (committed to the branch that ran) and deploys
  # the site. Independent of `file`; a failure here never blocks the email.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: digest
          path: build

      - name: Record this week
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -f build/briefs.json ]; then
            python3 scripts/build_site.py add build/digest.json --briefs build/briefs.json
          else
            python3 scripts/build_site.py add build/digest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weeks
          if git diff --cached --quiet; then
            echo "week already recorded; nothing to commit"
          else
            git commit -m "Record digest data for $(date -u '+%Y-%m-%d')"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Render site
        run: python3 scripts/build_site.py render --out site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
